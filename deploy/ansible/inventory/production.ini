; prom-gw 生产环境主机清单(示例,真实部署时按集群实际填)
; 段名 = ansible group;每行 = 一台机器的 SSH 地址
;
; 用法:
;   ansible -i inventory/production.ini prom_gw -m ping
;   ansible-playbook -i inventory/production.ini playbooks/deploy.yml

[prom_gw]
; 机房 A
prom-gw-a-01 ansible_host=10.10.0.11 ansible_user=deploy
prom-gw-a-02 ansible_host=10.10.0.12 ansible_user=deploy
; 机房 B
prom-gw-b-01 ansible_host=10.20.0.11 ansible_user=deploy
prom-gw-b-02 ansible_host=10.20.0.12 ansible_user=deploy

[prom_gw:vars]
; 角色共享变量,可在 group_vars/all.yml 覆盖
prom_gw_version      = v1.0.0
prom_gw_base_port    = 19201
prom_gw_admin_cidr   = 127.0.0.1/32,10.0.0.0/8
prom_gw_wal_dir      = /data/wal
prom_gw_config_dir   = /etc/prom-gw
prom_gw_release_dir  = /opt/prom-gw
