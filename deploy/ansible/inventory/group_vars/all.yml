---
# 全部 prom_gw group 共享的变量
# 真实部署时覆盖 inventory 中的同名变量即可

prom_gw_version: "v1.0.0"
prom_gw_base_port: 19201
prom_gw_metrics_port: 8080
prom_gw_health_port: 8081
prom_gw_admin_port: 8082

# 来源 IP 白名单(Admin API)
prom_gw_admin_allow_cidr: "127.0.0.1/32,10.0.0.0/8"

# 路径
prom_gw_release_dir: /opt/prom-gw
prom_gw_config_dir: /etc/prom-gw
prom_gw_wal_dir: /data/wal
prom_gw_log_dir: /var/log/prom-gw

# 单机实例数(每台机器起 N 个实例分担单机热点)
prom_gw_instances:
  - name: prom-gw-0
  - name: prom-gw-1

# Kafka / Nacos 源(由各机房独立配置)
prom_gw_kafka_brokers: "kafka-1:9092,kafka-2:9092"
prom_gw_nacos_addr: ""           # 空 = 不启用 Nacos
prom_gw_nacos_data_id: "prom-gw-rules"
prom_gw_nacos_group: "GATEWAY"

# 健康检查超时
prom_gw_healthcheck_timeout_s: 30
