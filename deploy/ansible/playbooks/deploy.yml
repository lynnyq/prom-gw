---
# playbooks/deploy.yml
# 滚动部署 prom-gw,每台机器按 prom_gw_instances 数量启动多个实例。
#
# 关键约束:
#   - 每批次只动 1 台机器,摘流 → 升级 → 健康检查通过 → 摘流恢复
#   - 任意一台健康检查失败 → 整个 deploy 失败,触发回滚
#   - `prom_gw_version` 可指向历史 tag,实现一键回滚
#
# 用法:
#   ansible-playbook -i inventory/production.ini playbooks/deploy.yml \
#     -e prom_gw_version=v1.0.0
---
- name: Deploy prom-gw
  hosts: prom_gw
  serial: 1
  roles:
    - role: prom_gw
