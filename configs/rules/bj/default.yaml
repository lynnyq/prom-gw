# 北京(bj)机房默认规则集
#
# 加载方式(spec 9.1 + 9.3):
#   - prom-gw@bj.service 启动时通过 INGEST_CITY=bj + --config 指向本文件
#   - 推荐 Ansible 部署时用变量替换:
#       prom_gw_config: "configs/rules/{{ city }}/default.yaml"
#
# 设计原则(spec 4.4):
#   - topic 命名 prom.bj.<stage>.<tenant>,避免跨城运维误操作
#   - 默认只透传,业务规则由各团队 PR 添加
rulesets:
  - name: bj-default
    tenant: bj
    default_topic: prom.bj.default
    version: 1
    stages: []
