# ============================================================
# prom-gw Ruleset 配置 - 本地开发 / 测试
# 用法:
#   KAFKA_BROKERS=localhost:9092 ./bin/prom-gw \
#     --config=configs/rules/sysid-routing.yaml \
#     --tokens=configs/tokens/local.yaml \
#     --wal-dir=/tmp/prom-gw-local-wal \
#     --source-dc=dc-local-dev \
#     --ingest-city=local
#
# 前置:先创建 topic(参考 docs/operations/prom-gw-operations-guide.md §10)
#   prom.local.routed.default / prom.local.routed.s001 / prom.local.routed.s002
#
# 数据流(prom-gw 单进程同步处理):
#   Prometheus remote_write → relabel → route(按 sysid) → prom.local.routed.<sysid>
#
# Prometheus 公共标签字段:
#   - datacenter  机房
#   - ip          IP 地址
#   - job         主机类型(pm 物理机 / vm 虚拟机 / pccmt 容器云平台)
#   - sproject    s 系统名称
#   - sysid       s 系统 ID 标识字符串(路由维度)
#
# 生产部署参考: configs/rules/<city>/default.yaml (bj/hf/sz)
# ============================================================
rulesets:
  - name: sysid-routing
    business: s-systems
    default_topic: prom.local.routed.default   # 未命中任何已知 sysid 的兜底 topic;
                                                # 若需严格过滤(丢弃未知 sysid),把此行改为空串 ""
    version: 1
    match:
      metric_prefix: ""                        # 空 = 全量接收
    stages:
      # Stage 1: relabel - 标签清洗(可选,按需保留/删除标签)
      - type: relabel
        drop_labels:
          - env                                # 环境标签(噪音)
          - instance                           # 实例标签(高基数,用 ip 替代)
          - pod                                # Pod 名(高基数)
        keep_labels: []                        # 空 = 关闭白名单
        label_map:
          kubernetes_io_cluster: cluster       # 重命名示例

      # Stage 2: route - 按 sysid 标签分桶到不同 topic
      # 新增 S 系统只需在此 rules 列表追加一条:
      #   - match: { sysid: "<新sysid>" }
      #     topic: prom.local.routed.<新sysid>
      - type: route
        rules:
          - match: { sysid: "s001" }           # S 系统 s001
            topic: prom.local.routed.s001
          - match: { sysid: "s002" }           # S 系统 s002
            topic: prom.local.routed.s002
        # 未命中以上规则 → 写入 default_topic (prom.local.routed.default)

      # Stage 3: sample - 采样(本地调试可设 1.0 保留全量)
      - type: sample
        rate: 1.0                              # 1.0 = 全量保留;生产可降到 0.1~0.5

global:
  rate_limit_per_instance: 100000              # 单实例全局 samples/s 上限
  channel_buffer: 65535                         # 内部 channel 缓冲区大小
