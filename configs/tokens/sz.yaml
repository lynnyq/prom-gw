# ============================================================
# prom-gw Token 配置 - 生产环境 - 深圳 (sz)
# 部署路径: /appdata/prom-gw/conf/tokens.yaml
# 权限要求: chmod 600, owner bdops:bdops
# 热重载: kill -HUP <pid>(无需重启进程)
#
# 安全提示: 此文件含 token 密钥,切勿入仓
#
# token 只负责鉴权(身份 + 限流),topic 路由完全由 rules
# (ruleset.default_topic + route stage) 负责,不再在此处配置。
#
# 架构:单一 business "s-systems" 覆盖所有 S 系统,
#       具体 topic 由 sysid-routing ruleset 按 sysid 分桶。
# ============================================================
tokens:
  # ── S 系统(sysid 分桶)业务 ──
  # Prometheus 携带 sysid 标签的 S 系统指标,
  # 由 sysid-routing ruleset 按 sysid 路由到 prom.sz.routed.<sysid>。
  # 新增 S 系统:在 ruleset 的 route stage 追加 match + topic 即可,无需改 token。
  "tk_systems_prod":
    business: s-systems
    business_id: "1003"
    rate_limit: 200000                              # S 系统总量级较大,放宽限流
