# ============================================================
# prom-gw Token 配置 - 生产环境 - 合肥 (hf)
# 部署路径: /appdata/prom-gw/conf/tokens.yaml
# 权限要求: chmod 600, owner bdops:bdops
# 热重载: kill -HUP <pid>(无需重启进程)
#
# token 与 topic 的对应关系:
#   tk_app_business_prod → prom.hf.routed.app_business
#   tk_infra_prod       → prom.hf.routed.infra
#
# 安全提示: 此文件含 token 密钥,切勿入仓
# ============================================================
tokens:
  # ── app-business 租户 ──
  # 业务应用指标:CPU/内存/QPS/RT/错误率 等
  "tk_app_business_prod":
    tenant: app-business
    tenant_id: "1001"
    default_topic: prom.hf.routed.app_business    # 写入的 topic(ruleset 配置后被覆盖)
    rate_limit: 80000                             # samples/s 上限,超过返回 429

  # ── infra 租户 ──
  # 基础设施指标:主机/网络/存储/容器 等
  "tk_infra_prod":
    tenant: infra
    tenant_id: "1002"
    default_topic: prom.hf.routed.infra           # 写入的 topic
    rate_limit: 50000
